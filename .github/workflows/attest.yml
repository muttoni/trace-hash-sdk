name: Build and attest artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.93.0
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-lock.txt
          .venv/bin/maturin build --release --locked --out dist
          .venv/bin/maturin sdist --out dist
          .venv/bin/python scripts/inventory.py > dist/dependencies.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: attested-reference-artifacts
          path: dist/*
