[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "trace-hash-sdk"
version = "0.1.0"
description = "Local multimodal fingerprints and privacy-conscious Trace integration"
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["httpx>=0.28,<0.29", "jsonschema>=4.23,<5", "defusedxml>=0.7,<0.8"]

[project.optional-dependencies]
media = ["numpy>=2,<3", "Pillow>=11,<13", "pdqhash==0.2.8", "av>=16,<17", "pypdfium2>=5,<6"]
data = ["pyarrow>=20,<24", "warcio>=1.7,<2"]
s3 = ["boto3>=1.35,<2"]
all = ["numpy>=2,<3", "Pillow>=11,<13", "pdqhash==0.2.8", "av>=16,<17", "pypdfium2>=5,<6", "pyarrow>=20,<24", "warcio>=1.7,<2", "boto3>=1.35,<2"]
dev = ["pytest>=8,<10", "maturin>=1.8,<2", "ruff>=0.11"]

[project.scripts]
trace-hash = "trace_hash.cli:main"

[tool.maturin]
manifest-path = "crates/trace-core/Cargo.toml"
python-source = "python"
module-name = "trace_hash._native"
features = ["extension-module"]
include = [
  "python/trace_hash/manifest.schema.json",
  "python/trace_hash/profiles.json",
  { path = "docs/**/*", format = "sdist" },
  { path = "schemas/**/*", format = "sdist" },
  { path = "tests/**/*.py", format = "sdist" },
  { path = "tests/vectors/*.json", format = "sdist" },
  { path = "scripts/*.py", format = "sdist" },
  { path = "examples/*.py", format = "sdist" },
  { path = "examples/*.json", format = "sdist" },
  { path = "benchmarks/*.json", format = "sdist" },
  { path = "requirements-lock.txt", format = "sdist" },
  { path = "CONTRIBUTING.md", format = "sdist" },
  { path = "SECURITY.md", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

