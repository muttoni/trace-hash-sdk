[package]
name = "trace-hash-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Deterministic local fingerprint primitives for Trace"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
blake3 = "=1.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "=0.1.24"
unicode-segmentation = "=1.12.0"
rustfft = "=6.4.1"
pyo3 = { version = "=0.23.5", optional = true, features = ["abi3-py311"] }

